<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Dashboard Ejecutivo CESPAL</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
    font-family:Segoe UI,sans-serif;
    background:#f5f7f8;
}

.top{
    background:#003b26;
    color:#fff;
    padding:18px;
}

.card-kpi{
    border:none;
    border-radius:16px;
    box-shadow:0 2px 10px rgba(0,0,0,.10);
}

.kpi{
    font-size:28px;
    font-weight:700;
    color:#006b3f;
}

canvas{
    max-height:350px;
}
</style>

</head>

<body>

<div class="top">
    <h2>Dashboard Ejecutivo</h2>
</div>

<div class="container-fluid p-3">

    <div class="row g-2 mb-3">

        <div class="col-md-4">
            <input type="file" id="otFile" class="form-control">
        </div>

        <div class="col-md-4">
            <input type="file" id="matFile" class="form-control">
        </div>

        <div class="col-md-4">
            <button class="btn btn-success w-100" onclick="procesar()">
                Procesar Datos
            </button>
        </div>

    </div>

    <div class="row g-3" id="kpis"></div>

    <div class="row mt-3">

        <div class="col-md-6">
            <canvas id="c1"></canvas>
        </div>

        <div class="col-md-6">
            <canvas id="c2"></canvas>
        </div>

    </div>

    <div class="row mt-3">

        <div class="col-md-6">
            <canvas id="c3"></canvas>
        </div>

        <div class="col-md-6">
            <canvas id="c4"></canvas>
        </div>

    </div>

    <input
        class="form-control my-3"
        id="bus"
        placeholder="Buscar..."
        oninput="filtrar()"
    >

    <div class="table-responsive">

        <table class="table table-striped table-hover">

            <thead class="table-dark">
                <tr>
                    <th>OT</th>
                    <th>Titular</th>
                    <th>Domicilio</th>
                    <th>Fecha Reclamo</th>
                    <th>Fecha Resolución</th>
                    <th>Costo OT</th>
                    <th>Cantidad Materiales</th>
                    <th>Participantes</th>
                </tr>
            </thead>

            <tbody id="tb"></tbody>

        </table>

    </div>

</div>

<script>

let base = [];

function calle(d){

    return (d || "")
        .split("CP:")[0]
        .replace(/[0-9]/g,"")
        .replace(/,/g,"")
        .trim();

}


function read(f){

    return new Promise(resolve=>{

        const fr = new FileReader();

        fr.onload = e =>
            resolve(
                JSON.parse(e.target.result)
            );

        fr.readAsText(f);

    });

}

async function procesar(){

    const ot =
        await read(
            document
            .getElementById("otFile")
            .files[0]
        );

    const mt =
        await read(
            document
            .getElementById("matFile")
            .files[0]
        );

    const map = {};

    mt.forEach(m=>{

      const key =
    claveTitular(
        m.Titular
    );

        if(!map[key]){

            map[key] = {

                costo:0,
                cant:0,
                participantes:new Set()

            };

        }

        map[key].costo +=
            (+m.Importe || 0);

        map[key].cant++;

        if(Array.isArray(m.Participantes)){

            m.Participantes.forEach(p=>{

                map[key]
                .participantes
                .add(p);

            });

        }

    });

    base = ot.map(o=>{

     const info =
    map[
        claveTitular(
            o.Titular
        )
    ];

        return {

            ...o,

            CostoOT:
                info?.costo || 0,

            CantidadMateriales:
                info?.cant || 0,

            Participantes:
                info
                ? [...info.participantes].join(", ")
                : ""

        };

    });

    console.log(
        "Titulares Materiales:",
        Object.keys(map).length
    );

    console.log(
        "Titular ejemplo:",
        ot[0].Titular
    );
const encontrados =
    base.filter(
        x => x.CantidadMateriales > 0
    ).length;

console.log(
    "OT con cruce:",
    encontrados
);

console.log(
    "OT Totales:",
    base.length
);
    render(mt);

}
    function normalizarTitular(nombre){

    return String(nombre || "")
        .toUpperCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"")
        .replace(/\s+/g," ")
        .trim();

}
    function claveTitular(nombre){

    nombre = normalizarTitular(nombre);

    return nombre
        .split(" ")
        .slice(0,3)
        .join(" ");

}

function render(mt){

    const totalOT =
        base.length;

    const clientes =
        new Set(
            base.map(x=>x.Titular)
        ).size;

    const calles =
        new Set(
            base.map(
                x=>calle(
                    x.Domicilio
                )
            )
        ).size;

    const materiales =
        new Set(
            mt.map(
                x=>x.Material
            )
        ).size;

    const costo =
        base.reduce(
            (a,b)=>a+b.CostoOT,
            0
        );

    const promedio =
        totalOT
            ? costo/totalOT
            : 0;

    const conMateriales =
        base.filter(
            x=>x.CantidadMateriales>0
        ).length;

    const sinMateriales =
        totalOT-conMateriales;

    const cards = [

        ["Total OT",totalOT],
        ["Clientes Únicos",clientes],
        ["Calles Únicas",calles],
        ["Materiales Utilizados",materiales],
        ["Costo Total","$"+costo.toFixed(0)],
        ["Costo Promedio","$"+promedio.toFixed(0)],
        ["OT con Materiales",conMateriales],
        ["OT sin Materiales",sinMateriales]

    ];

    document.getElementById("kpis").innerHTML =
        cards.map(i=>`
        <div class="col-md-3">
            <div class="card card-kpi">
                <div class="card-body">
                    <div>${i[0]}</div>
                    <div class="kpi">${i[1]}</div>
                </div>
            </div>
        </div>
        `).join("");

    document.getElementById("tb").innerHTML =
        base.map(x=>`

        <tr>

            <td>${x.OT}</td>

            <td>${x.Titular || ""}</td>

            <td>${x.Domicilio || ""}</td>

            <td>${x.FechaReclamo || ""}</td>

            <td>${x.FechaResolucion || ""}</td>

            <td>${x.CostoOT.toFixed(0)}</td>

            <td>${x.CantidadMateriales}</td>

            <td>${x.Participantes}</td>

        </tr>

        `).join("");

    rankingClientes(mt);
    rankingMateriales(mt);
    rankingCalles();
    evolucionMensual();

}

function rankingClientes(){

    const data = {};

    base.forEach(x=>{

        data[x.Titular] =
            (data[x.Titular]||0)+1;

    });

    const top =
        Object.entries(data)
        .sort((a,b)=>b[1]-a[1])
        .slice(0,10);

    graf(
        "c1",
        top.map(x=>x[0]),
        top.map(x=>x[1]),
        "Top Clientes"
    );

}

function rankingMateriales(mt){

    const data = {};

    mt.forEach(x=>{

        data[x.Material] =
            (data[x.Material]||0)
            + (+x.Importe||0);

    });

    const top =
        Object.entries(data)
        .sort((a,b)=>b[1]-a[1])
        .slice(0,10);

    graf(
        "c2",
        top.map(x=>x[0]),
        top.map(x=>x[1]),
        "Top Materiales"
    );

}

function rankingCalles(){

    const data = {};

    base.forEach(x=>{

        const c =
            calle(
                x.Domicilio
            );

        data[c] =
            (data[c]||0)+1;

    });

    const top =
        Object.entries(data)
        .sort((a,b)=>b[1]-a[1])
        .slice(0,10);

    graf(
        "c3",
        top.map(x=>x[0]),
        top.map(x=>x[1]),
        "Ranking Calles"
    );

}

function evolucionMensual(){

    const data = {};

    base.forEach(x=>{

        const mes =
            (x.FechaReclamo||"")
            .substring(0,7);

        data[mes] =
            (data[mes]||0)+1;

    });

    const meses =
        Object.keys(data)
        .sort();

    graf(
        "c4",
        meses,
        meses.map(x=>data[x]),
        "OT por Mes"
    );

}

function graf(id,l,d,t){

    new Chart(
        document.getElementById(id),
        {
            type:"bar",
            data:{
                labels:l,
                datasets:[{
                    data:d,
                    backgroundColor:"#00a85a"
                }]
            },
            options:{
                responsive:true,
                plugins:{
                    legend:{
                        display:false
                    },
                    title:{
                        display:true,
                        text:t
                    }
                }
            }
        }
    );

}

function filtrar(){

    let texto =
        document
        .getElementById("bus")
        .value
        .toLowerCase();

    [...document.querySelectorAll("#tb tr")]
    .forEach(r=>{

        r.style.display =
            r.innerText
            .toLowerCase()
            .includes(texto)
            ? ""
            : "none";

    });

}

</script>

</body>
</html>
