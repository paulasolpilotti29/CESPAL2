<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Dashboard CESPAL</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
    background:#f5f6fa;
}

.card-kpi{
    text-align:center;
    padding:20px;
    border:none;
    border-radius:12px;
    box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.card-kpi h3{
    font-size:28px;
    font-weight:bold;
    color:#0d6efd;
}

canvas{
    background:white;
    padding:10px;
    border-radius:12px;
    box-shadow:0 3px 10px rgba(0,0,0,.08);
}

table{
    font-size:12px;
}

</style>

</head>
<body>

<div class="container-fluid p-4">

<h2 class="mb-4">
Dashboard CESPAL
</h2>

<div class="row mb-4">

<div class="col-md-6">
<label class="form-label">
OT Consolidado
</label>

<input
id="otFile"
type="file"
class="form-control"
accept=".json">
</div>

<div class="col-md-6">
<label class="form-label">
Materiales
</label>

<input
id="matFile"
type="file"
class="form-control"
accept=".json">
</div>

</div>

<button
class="btn btn-primary mb-4"
onclick="procesar()">

Procesar Información

</button>

<div class="row mb-4">

<div class="col-md-3">
<div class="card card-kpi">
<h6>OT</h6>
<h3 id="kpiOT">0</h3>
</div>
</div>

<div class="col-md-3">
<div class="card card-kpi">
<h6>Costo Total</h6>
<h3 id="kpiCosto">$0</h3>
</div>
</div>

<div class="col-md-3">
<div class="card card-kpi">
<h6>Materiales</h6>
<h3 id="kpiMat">0</h3>
</div>
</div>

<div class="col-md-3">
<div class="card card-kpi">
<h6>Participantes</h6>
<h3 id="kpiPart">0</h3>
</div>
</div>

</div>

<div class="row">

<div class="col-md-6">
<canvas id="c1"></canvas>
</div>

<div class="col-md-6">
<canvas id="c2"></canvas>
</div>

</div>

<hr class="my-4">

<div class="table-responsive">

<table class="table table-striped table-bordered">

<thead class="table-dark">

<tr>
<th>OT</th>
<th>Titular</th>
<th>Domicilio</th>
<th>Servicio</th>
<th>Participantes</th>
<th>Costo OT</th>
</tr>

</thead>

<tbody id="tabla">

</tbody>

</table>

</div>

</div>

<script>

let base=[];

async function read(file){

    return JSON.parse(
        await file.text()
    );

}

function numero(v){

    return Number(v||0);

}

async function procesar(){

    const ot=
        await read(
            document.getElementById("otFile").files[0]
        );

    const mt=
        await read(
            document.getElementById("matFile").files[0]
        );

    const mapa={};

    mt.forEach(m=>{

        const id=
            String(
                m.OT || ""
            ).trim();

        if(!mapa[id]){

            mapa[id]={

                costo:0,
                participantes:new Set(),
                materiales:new Set()

            };

        }

        mapa[id].costo+=
            numero(m.COSTO_TOTAL);

        if(m.MATERIAL){

            mapa[id]
                .materiales
                .add(m.MATERIAL);

        }

        if(m.PARTICIPANTES){

            m.PARTICIPANTES
            .split(";")
            .forEach(p=>{

                if(p.trim()){

                    mapa[id]
                     .participantes
                     .add(p.trim());

                }

            });

        }

    });

    base=
    ot.map(o=>{

        const info=
            mapa[
                String(o.OT).trim()
            ] || {};

        return {

            ...o,

            CostoOT:
                info.costo || 0,

            Participantes:
                info.participantes
                ? [...info.participantes].join(", ")
                : "",

            Materiales:
                info.materiales
                ? [...info.materiales].join(", ")
                : ""

        };

    });

    cargarKPIs(mt);

    rankingClientes();

    rankingMateriales(mt);

    cargarTabla();

}

function cargarKPIs(mt){

    document.getElementById("kpiOT")
        .innerText=
        base.length.toLocaleString();

    const costo=
        base.reduce(
        (a,b)=>a+b.CostoOT,0
        );

    document.getElementById("kpiCosto")
        .innerText=
        "$"+
        costo.toLocaleString();

    document.getElementById("kpiMat")
        .innerText=
        new Set(
            mt.map(
                x=>x.MATERIAL
            )
        ).size;

    const personas=
        new Set();

    mt.forEach(x=>{

        if(!x.PARTICIPANTES)
            return;

        x.PARTICIPANTES
        .split(";")
        .forEach(p=>{

            personas.add(
                p.trim()
            );

        });

    });

    document
        .getElementById("kpiPart")
        .innerText=
        personas.size;

}

function rankingClientes(){

    const data={};

    base.forEach(x=>{

        data[x.Titular]=
        (data[x.Titular]||0)
        + x.CostoOT;

    });

    const top=
        Object.entries(data)
        .sort((a,b)=>b[1]-a[1])
        .slice(0,10);

    new Chart(
        document.getElementById("c1"),
        {
            type:"bar",
            data:{
                labels:top.map(x=>x[0]),
                datasets:[{
                    label:"Costo",
                    data:top.map(x=>x[1])
                }]
            }
        }
    );

}

function rankingMateriales(mt){

    const data={};

    mt.forEach(x=>{

        data[x.MATERIAL]=
        (data[x.MATERIAL]||0)
        +
        numero(
            x.COSTO_TOTAL
        );

    });

    const top=
        Object.entries(data)
        .sort((a,b)=>b[1]-a[1])
        .slice(0,10);

    new Chart(
        document.getElementById("c2"),
        {
            type:"bar",
            data:{
                labels:top.map(x=>x[0]),
                datasets:[{
                    label:"Costo",
                    data:top.map(x=>x[1])
                }]
            }
        }
    );

}

function cargarTabla(){

    const tb=
    document.getElementById("tabla");

    tb.innerHTML="";

    base.forEach(x=>{

        tb.innerHTML+=`

        <tr>

        <td>${x.OT}</td>

        <td>${x.Titular||""}</td>

        <td>${x.Domicilio||""}</td>

        <td>${x.Servicio||""}</td>

        <td>${x.Participantes||""}</td>

        <td>
        $
        ${Number(
          x.CostoOT||0
        ).toLocaleString()}
        </td>

        </tr>

        `;

    });

}

</script>

</body>
</html>
