<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard Ejecutivo CESPAL</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><style>body{font-family:Segoe UI,sans-serif;background:#f5f7f8}.top{background:#003b26;color:#fff;padding:18px}.card-kpi{border:none;border-radius:16px;box-shadow:0 2px 10px rgba(0,0,0,.1)}.kpi{font-size:28px;font-weight:700;color:#006b3f}</style></head><body><div class="top"><h2>Dashboard Ejecutivo</h2></div><div class="container-fluid p-3"><div class="row g-2 mb-3"><div class="col-md-4"><input type=file id=otFile class=form-control></div><div class="col-md-4"><input type=file id=matFile class=form-control></div><div class="col-md-4"><button class="btn btn-success w-100" onclick="procesar()">Procesar Datos</button></div></div><div class="row g-3" id='kpis'></div><div class="row mt-3"><div class="col-md-6"><canvas id=c1></canvas></div><div class="col-md-6"><canvas id=c2></canvas></div></div><div class="row mt-3"><div class="col-md-6"><canvas id=c3></canvas></div><div class="col-md-6"><canvas id=c4></canvas></div></div><input class='form-control my-3' id=bus placeholder='Buscar...' oninput='filtrar()'><div class='table-responsive'><table class='table table-striped'><thead><tr><th>OT</th><th>Titular</th><th>Domicilio</th><th>Fecha Reclamo</th><th>Fecha Resolucion</th><th>Costo OT</th><th>Cantidad Materiales</th><th>Participantes</th></tr></thead><tbody id=tb></tbody></table></div></div><script>let base=[];function read(f){return new Promise(r=>{let fr=new FileReader();fr.onload=e=>r(JSON.parse(e.target.result));fr.readAsText(f);});}async function procesar(){let ot=await read(otFile.files[0]);let mt=await read(matFile.files[0]);let map={};mt.forEach(m=>{if(!map[m.OT])map[m.OT]={costo:0,cant:0,par:new Set()};map[m.OT].costo+=(+m.Importe||0);map[m.OT].cant++;if(m.Participantes)map[m.OT].par.add(m.Participantes);});base=ot.map(o=>({...o,CostoOT:map[o.OT]?.costo||0,CantidadMateriales:map[o.OT]?.cant||0,Participantes:[...(map[o.OT]?.par||[])].join(', ')}));render(mt);}function render(mt){let totalOT=base.length,clientes=new Set(base.map(x=>x.Titular)).size,calles=new Set(base.map(x=>x.Domicilio)).size,mat=mt.length,costo=base.reduce((a,b)=>a+b.CostoOT,0),prom=totalOT?costo/totalOT:0,con=base.filter(x=>x.CantidadMateriales>0).length,sin=totalOT-con;let arr=[['Total OT',totalOT],['Clientes Únicos',clientes],['Calles Únicas',calles],['Materiales Utilizados',mat],['Costo Total','$'+costo.toFixed(0)],['Costo Promedio OT','$'+prom.toFixed(0)],['OT con Materiales',con],['OT sin Materiales',sin]];kpis.innerHTML=arr.map(i=>`<div class='col-md-3'><div class='card card-kpi'><div class='card-body'><div>${i[0]}</div><div class='kpi'>${i[1]}</div></div></div></div>`).join('');tb.innerHTML=base.map(x=>`<tr><td>${x.OT}</td><td>${x.Titular||''}</td><td>${x.Domicilio||''}</td><td>${x.FechaReclamo||''}</td><td>${x.FechaResolucion||''}</td><td>${x.CostoOT.toFixed(2)}</td><td>${x.CantidadMateriales}</td><td>${x.Participantes}</td></tr>`).join('');const clientesTop={};base.forEach(x=>clientesTop[x.Titular]=(clientesTop[x.Titular]||0)+1);graf('c1',Object.keys(clientesTop).slice(0,10),Object.values(clientesTop).slice(0,10),'Top Clientes');const matTop={};mt.forEach(x=>matTop[x.Material]=(matTop[x.Material]||0)+(+x.Importe||0));graf('c2',Object.keys(matTop).slice(0,10),Object.values(matTop).slice(0,10),'Top Materiales');const callesTop={};base.forEach(x=>callesTop[x.Domicilio]=(callesTop[x.Domicilio]||0)+1);graf('c3',Object.keys(callesTop).slice(0,10),Object.values(callesTop).slice(0,10),'Ranking Calles');const meses={};base.forEach(x=>{let m=(x.FechaReclamo||'').substring(0,7);meses[m]=(meses[m]||0)+1});graf('c4',Object.keys(meses),Object.values(meses),'OT por Mes');}function graf(id,l,d,t){new Chart(document.getElementById(id),{type:'bar',data:{labels:l,datasets:[{data:d,backgroundColor:'#00a85a'}]},options:{plugins:{legend:{display:false},title:{display:true,text:t}}}})}function filtrar(){let b=bus.value.toLowerCase();[...tb.rows].forEach(r=>r.style.display=r.innerText.toLowerCase().includes(b)?'':'none');}</script></body></html>
